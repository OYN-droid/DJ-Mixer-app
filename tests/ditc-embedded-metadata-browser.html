<!doctype html>
<meta charset="utf-8">
<title>RUNNING · DITC embedded metadata</title>
<pre id="result">Running…</pre>
<iframe id="app" title="DITC embedded metadata browser test" style="width:1280px;height:900px;border:0"></iframe>
<script>
(async () => {
  const checks = {}; const errors = []; const frame = document.querySelector("#app");
  const backup = Array.from({ length: localStorage.length }, (_, index) => localStorage.key(index)).filter(Boolean).map((key) => [key, localStorage.getItem(key)]);
  const restore = () => { localStorage.clear(); backup.forEach(([key, value]) => localStorage.setItem(key, value)); };
  const check = (name, condition, detail = null) => { checks[name] = { pass: Boolean(condition), detail }; if (!condition) throw new Error(name); };
  const waitFor = async (predicate, timeout = 10000) => { const started = performance.now(); while (performance.now() - started < timeout) { const value = predicate(); if (value) return value; await new Promise((resolve) => setTimeout(resolve, 25)); } throw new Error("Timed out waiting for application state"); };
  const setFiles = (input, files) => { const transfer = new DataTransfer(); files.forEach((file) => transfer.items.add(file)); input.files = transfer.files; input.dispatchEvent(new Event("change", { bubbles: true })); };
  try {
    localStorage.clear(); frame.contentWindow.addEventListener("error", (event) => errors.push(event.error?.stack || event.message)); frame.src = "../index.html?ditc-embedded-metadata-test=1";
    const app = await waitFor(() => frame.contentDocument?.readyState === "complete" && frame.contentDocument.querySelector("#projectLibraryCreate") && frame.contentDocument);
    frame.contentWindow.confirm = () => true;
    app.querySelector("#projectLibraryCreate").click(); app.querySelector("#newProjectName").value = "Embedded Metadata QA"; app.querySelector("#createProjectForm").requestSubmit(); await waitFor(() => app.querySelector("#ai.is-active"));
    check("jsmediatags CDN library loads", typeof frame.contentWindow.jsmediatags?.read === "function");

    frame.contentWindow.jsmediatags = { read: (_file, handlers) => handlers.onSuccess({ tags: { title: "Embedded Title", artist: "Embedded Artist", album: "Embedded Album", year: "2026", genre: "House", track: "3", picture: { format: "image/jpeg", data: [1] } } }) };
    setFiles(app.querySelector("#ditcFileInput"), [new File([new Uint8Array(32)], "Wrong Artist - Wrong Title.mp3", { type: "audio/mpeg" })]);
    await waitFor(() => app.querySelector("#sourceList").textContent.includes("Embedded Title"));
    check("manual picker uses embedded title and artist", app.querySelector("#sourceList").textContent.includes("Embedded Artist") && !app.querySelector("#sourceList").textContent.includes("Wrong Title"), app.querySelector("#sourceList").textContent);
    check("embedded genre displays before heuristic analysis", app.querySelector("#sourceList").textContent.includes("House") && app.querySelector("#sourceList").textContent.includes("N/A BPM"), app.querySelector("#sourceList").textContent);
    check("embedded album metadata is retained", Array.from({ length: localStorage.length }, (_, index) => localStorage.getItem(localStorage.key(index))).some((value) => value?.includes("Embedded Album") && value.includes("embedded-tag")));

    frame.contentWindow.jsmediatags = { read: (_file, handlers) => handlers.onSuccess({ tags: {} }) };
    const transfer = new DataTransfer(); transfer.items.add(new File([new Uint8Array(32)], "Fallback Artist - Fallback Title.mp3", { type: "audio/mpeg", lastModified: 5000 }));
    app.querySelector("#sourceDrop").dispatchEvent(new DragEvent("drop", { bubbles: true, cancelable: true, dataTransfer: transfer }));
    await waitFor(() => app.querySelector("#sourceList").textContent.includes("Fallback Title"));
    check("missing embedded tags fall back to filename metadata", app.querySelector("#sourceList").textContent.includes("Fallback Artist"), app.querySelector("#sourceList").textContent);

    frame.contentWindow.jsmediatags = { read: (_file, handlers) => handlers.onSuccess({ tags: { title: "Recovered Title", artist: "Recovered Artist", album: "Recovered Album" } }) };
    setFiles(app.querySelector("#ditcFileInput"), [new File([new Uint8Array(32)], "Fallback Artist - Fallback Title.mp3", { type: "audio/mpeg", lastModified: 5000 })]);
    await waitFor(() => app.querySelector("#sourceList").textContent.includes("Recovered Artist"));
    check("reimport refreshes an existing filename-derived source", app.querySelector("#sourceList").textContent.includes("Recovered Title") && app.querySelector("#sourceList").textContent.includes("Recovered Album"), app.querySelector("#sourceList").textContent);
    check("no uncaught errors", errors.length === 0, errors);
    document.title = `PASS · ${Object.keys(checks).length} DITC metadata checks`; result.textContent = JSON.stringify({ status: "PASS", checkCount: Object.keys(checks).length, checks }, null, 2); restore();
  } catch (error) { document.title = `FAIL · ${error.message}`; result.textContent = JSON.stringify({ status: "FAIL", message: error.message, stack: error.stack, checks, errors }, null, 2); restore(); }
})();
</script>
